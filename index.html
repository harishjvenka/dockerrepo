<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieTix · Select your seats</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #1a1e2b, #0c0f16);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
        }

        .booking-container {
            background: #141a24;
            background: linear-gradient(145deg, #1b212d, #12171f);
            max-width: 1000px;
            width: 100%;
            border-radius: 2.5rem;
            padding: 2rem 1.8rem;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.05);
            color: #eef3fc;
        }

        h1 {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: -0.5px;
            color: #fff;
            margin-bottom: 1.6rem;
        }

        h1 span {
            background: #f5c542;
            color: #0b0e14;
            font-size: 1rem;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .movie-details {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 2rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1.8rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .detail-item .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8d9bb5;
            font-weight: 500;
        }

        .detail-item .value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .detail-item .value i {
            font-style: normal;
            opacity: 0.8;
        }

        .screen-area {
            perspective: 800px;
            margin: 2rem 0 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screen {
            width: 80%;
            height: 28px;
            background: linear-gradient(to bottom, #d4dcec, #b0bdd4);
            border-radius: 50% / 100% 100% 0 0;
            box-shadow: 0 15px 25px -8px #b0bdd4, 0 0 0 2px rgba(255, 255, 255, 0.2);
            margin-bottom: 0.8rem;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 4px;
            color: #141a24;
            text-transform: uppercase;
            opacity: 0.9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen-label {
            font-size: 0.8rem;
            color: #9aaec9;
            letter-spacing: 2px;
            margin-top: 0.4rem;
        }

        .seats-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            margin: 2rem 0 1.2rem;
        }

        .seat-row {
            display: flex;
            gap: 0.7rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .seat {
            width: 2.3rem;
            height: 2.3rem;
            background: #2c3545;
            border-radius: 12px 12px 8px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: #b6c5dd;
            cursor: pointer;
            transition: all 0.12s ease;
            border: 1.5px solid #3e4a5e;
            box-shadow: 0 4px 0 #0e1219;
            user-select: none;
        }

        .seat:hover:not(.occupied):not(.selected) {
            background: #3d4a60;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #0e1219;
        }

        .seat.selected {
            background: #f5c542;
            background: linear-gradient(145deg, #ffd966, #f5b81b);
            border-color: #ffdf8c;
            color: #141a24;
            box-shadow: 0 4px 0 #a07d1a;
            transform: translateY(-1px);
            font-weight: 700;
        }

        .seat.occupied {
            background: #1e232e;
            border-color: #2a3140;
            color: #4f5b70;
            cursor: not-allowed;
            box-shadow: 0 2px 0 #0a0d12;
            opacity: 0.6;
            font-size: 0.9rem;
        }

        .seat.occupied::before {
            content: "✕";
            font-weight: 300;
        }

        .seat.occupied span {
            display: none;
        }

        .row-label {
            width: 1.8rem;
            font-weight: 600;
            color: #7d8ca8;
            font-size: 0.8rem;
            text-align: right;
            margin-right: 0.3rem;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            justify-content: center;
            margin: 1.8rem 0 2rem;
            font-size: 0.85rem;
            color: #b1c1da;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .legend-box {
            width: 1.4rem;
            height: 1.4rem;
            border-radius: 6px;
            background: #2c3545;
            border: 1.5px solid #3e4a5e;
        }

        .legend-box.selected {
            background: #f5c542;
            border-color: #ffdf8c;
        }

        .legend-box.occupied {
            background: #1e232e;
            border-color: #2a3140;
            opacity: 0.6;
        }

        .selection-summary {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #0e121b;
            border-radius: 2rem;
            padding: 1rem 1.8rem;
            border: 1px solid #29313f;
            margin-bottom: 1.5rem;
        }

        .selected-seats-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            align-items: center;
        }

        .selected-seats-list .badge {
            background: #f5c54220;
            color: #f5c542;
            border: 1px solid #f5c54240;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .selected-seats-list .empty {
            color: #6b7c99;
            font-style: italic;
        }

        .total-price {
            font-size: 1.7rem;
            font-weight: 700;
            color: #f5c542;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .total-price small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #8d9bb5;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .btn {
            border: none;
            padding: 1rem 2.2rem;
            border-radius: 3rem;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            letter-spacing: 0.3px;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: #f5c542;
            background: linear-gradient(145deg, #ffd966, #f5b81b);
            color: #141a24;
            box-shadow: 0 10px 18px -8px #f5b81b;
        }

        .btn-primary:hover:not(:disabled) {
            background: #ffd15c;
            transform: translateY(-2px);
            box-shadow: 0 16px 22px -10px #f5b81b;
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: transparent;
            color: #b1c1da;
            border: 1.5px solid #2e3a4b;
        }

        .btn-secondary:hover {
            background: #1e2531;
            border-color: #4b5a70;
            color: #fff;
        }

        .message {
            margin-top: 1.5rem;
            text-align: center;
            font-weight: 500;
            padding: 0.8rem 1.2rem;
            border-radius: 3rem;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: #1e2b3a;
            color: #b6d0f0;
            border: 1px solid #31465e;
            transition: all 0.2s;
        }

        .message.error {
            background: #2e1b1b;
            color: #ffb3b3;
            border-color: #5e3131;
        }

        .message.hidden {
            opacity: 0;
            visibility: hidden;
            padding: 0;
            margin: 0;
            min-height: 0;
            border: none;
            background: transparent;
        }

        @media (max-width: 700px) {
            .booking-container {
                padding: 1.5rem 1rem;
            }
            .seat {
                width: 1.9rem;
                height: 1.9rem;
                font-size: 0.65rem;
            }
            .row-label {
                width: 1.2rem;
                font-size: 0.7rem;
            }
            .selection-summary {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
            }
            .action-buttons {
                width: 100%;
                justify-content: stretch;
            }
            .btn {
                flex: 1;
                justify-content: center;
                padding: 0.9rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="booking-container">
        <h1>
            🎬 MovieTix
            <span>seat selection</span>
        </h1>

        <!-- static movie details, but interactive context -->
        <div class="movie-details">
            <div class="detail-item">
                <span class="label">Movie</span>
                <span class="value"><i>🎥</i> Dune: Part Two</span>
            </div>
            <div class="detail-item">
                <span class="label">Theatre</span>
                <span class="value"><i>📍</i> Grand Cineplex · Hall 4</span>
            </div>
            <div class="detail-item">
                <span class="label">Date & Time</span>
                <span class="value"><i>📅</i> Today · 7:30 PM</span>
            </div>
            <div class="detail-item">
                <span class="label">Ticket price</span>
                <span class="value"><i>💰</i> $14.50 <span style="font-size:0.8rem; color:#8d9bb5;">/ seat</span></span>
            </div>
        </div>

        <!-- screen representation -->
        <div class="screen-area">
            <div class="screen">SCREEN</div>
            <div class="screen-label">all eyes this way</div>
        </div>

        <!-- seat grid generated via js -->
        <div class="seats-grid" id="seatsGrid"></div>

        <!-- legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-box"></div>
                <span>Available</span>
            </div>
            <div class="legend-item">
                <div class="legend-box selected"></div>
                <span>Selected</span>
            </div>
            <div class="legend-item">
                <div class="legend-box occupied"></div>
                <span>Occupied</span>
            </div>
        </div>

        <!-- selection summary (live) -->
        <div class="selection-summary">
            <div class="selected-seats-list" id="selectedSeatsList">
                <span class="empty">No seats selected yet</span>
            </div>
            <div class="total-price">
                $<span id="totalPrice">0</span>
                <small>USD</small>
            </div>
        </div>

        <!-- action buttons (booking steps) -->
        <div class="action-buttons">
            <button class="btn btn-secondary" id="clearBtn">Clear</button>
            <button class="btn btn-primary" id="checkoutBtn">Proceed to checkout</button>
        </div>

        <!-- message area -->
        <div id="messageBox" class="message hidden">
            <span>ℹ️</span> <span id="messageText"></span>
        </div>
    </div>

    <script>
        (function(){
            // ---------- configuration ----------
            const TICKET_PRICE = 14.50; // per seat
            const ROWS = 7;              // A to G (7 rows)
            const COLS = 10;             // 10 seats per row
            const SEAT_LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];

            // Pre-occupied seats (simulate already booked seats) — friendly random pattern
            const OCCUPIED_SEATS = new Set([
                'A3', 'A4', 'B5', 'B6', 'C1', 'C2', 'D7', 'D8',
                'E4', 'E5', 'F9', 'F10', 'G2', 'G3', 'G6', 'G7',
                'A9', 'B2', 'C8', 'D1', 'E10', 'F4', 'G9'
            ]);

            // ---------- state ----------
            let selectedSeats = new Set();   // holds seat ids like 'A5', 'B7' ...

            // DOM elements
            const seatsGrid = document.getElementById('seatsGrid');
            const selectedSeatsList = document.getElementById('selectedSeatsList');
            const totalPriceSpan = document.getElementById('totalPrice');
            const clearBtn = document.getElementById('clearBtn');
            const checkoutBtn = document.getElementById('checkoutBtn');
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');

            // ---------- helper: show message ----------
            function showMessage(text, isError = false) {
                messageText.textContent = text;
                messageBox.classList.remove('hidden', 'error');
                if (isError) {
                    messageBox.classList.add('error');
                } else {
                    messageBox.classList.remove('error');
                }
                clearTimeout(window.msgTimer);
                window.msgTimer = setTimeout(() => {
                    messageBox.classList.add('hidden');
                }, 3500);
            }

            // ---------- render seat grid ----------
            function renderSeats() {
                seatsGrid.innerHTML = '';

                for (let r = 0; r < ROWS; r++) {
                    const rowLetter = SEAT_LETTERS[r];
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'seat-row';

                    // row label
                    const labelSpan = document.createElement('span');
                    labelSpan.className = 'row-label';
                    labelSpan.textContent = rowLetter;
                    rowDiv.appendChild(labelSpan);

                    for (let c = 1; c <= COLS; c++) {
                        const seatId = `${rowLetter}${c}`;
                        const seatDiv = document.createElement('div');
                        seatDiv.className = 'seat';
                        seatDiv.dataset.seatId = seatId;
                        seatDiv.textContent = c;   // show seat number

                        // check if occupied
                        if (OCCUPIED_SEATS.has(seatId)) {
                            seatDiv.classList.add('occupied');
                        } else {
                            // check if it's already selected (e.g., after clear/re-render)
                            if (selectedSeats.has(seatId)) {
                                seatDiv.classList.add('selected');
                            }
                        }

                        // click handler
                        seatDiv.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const id = seatDiv.dataset.seatId;
                            // ignore occupied
                            if (seatDiv.classList.contains('occupied')) {
                                showMessage(`❌ Seat ${id} is already taken.`, true);
                                return;
                            }

                            // toggle selection
                            if (selectedSeats.has(id)) {
                                selectedSeats.delete(id);
                                seatDiv.classList.remove('selected');
                            } else {
                                selectedSeats.add(id);
                                seatDiv.classList.add('selected');
                            }

                            updateSummary();
                            // clear any previous error when user interacts
                            if (!messageBox.classList.contains('hidden') && messageBox.classList.contains('error')) {
                                messageBox.classList.add('hidden');
                            }
                        });

                        rowDiv.appendChild(seatDiv);
                    }
                    seatsGrid.appendChild(rowDiv);
                }
            }

            // ---------- update summary (selected seats & total price) ----------
            function updateSummary() {
                // update selected seats list display
                if (selectedSeats.size === 0) {
                    selectedSeatsList.innerHTML = '<span class="empty">No seats selected yet</span>';
                    totalPriceSpan.textContent = '0';
                    checkoutBtn.disabled = true;
                    checkoutBtn.style.opacity = '0.5';
                    checkoutBtn.style.cursor = 'not-allowed';
                    return;
                }

                // enable checkout button
                checkoutBtn.disabled = false;
                checkoutBtn.style.opacity = '1';
                checkoutBtn.style.cursor = 'pointer';

                // build badges
                const sortedSeats = Array.from(selectedSeats).sort((a, b) => {
                    const rowA = a[0];
                    const rowB = b[0];
                    if (rowA !== rowB) return rowA.localeCompare(rowB);
                    return parseInt(a.slice(1)) - parseInt(b.slice(1));
                });

                selectedSeatsList.innerHTML = sortedSeats
                    .map(seat => `<span class="badge">${seat}</span>`)
                    .join('');

                // update total price
                const total = (selectedSeats.size * TICKET_PRICE).toFixed(2);
                totalPriceSpan.textContent = total;
            }

            // ---------- clear all selected seats ----------
            function clearSelection() {
                if (selectedSeats.size === 0) {
                    showMessage('No seats to clear.', false);
                    return;
                }
                selectedSeats.clear();

                // remove 'selected' class from all seats
                document.querySelectorAll('.seat.selected').forEach(seat => {
                    seat.classList.remove('selected');
                });

                updateSummary();
                showMessage('✨ Selection cleared.');
            }

            // ---------- checkout simulation ----------
            function proceedToCheckout() {
                if (selectedSeats.size === 0) {
                    showMessage('Please select at least one seat.', true);
                    return;
                }

                const seatList = Array.from(selectedSeats).sort((a, b) => {
                    const rowA = a[0];
                    const rowB = b[0];
                    if (rowA !== rowB) return rowA.localeCompare(rowB);
                    return parseInt(a.slice(1)) - parseInt(b.slice(1));
                }).join(', ');

                const total = (selectedSeats.size * TICKET_PRICE).toFixed(2);
                showMessage(`✅ Proceeding with ${selectedSeats.size} seat${selectedSeats.size > 1 ? 's' : ''} (${seatList}) · Total $${total}`, false);

                // In a real app, redirect or show payment. Here we just simulate.
                // You could open a modal or redirect.
            }

            // ---------- initial load ----------
            function init() {
                // initialize with a couple of selected seats for demo? No, start clean.
                // but we want friendly state: if we want, we can preselect some seats. I'll leave empty.
                selectedSeats.clear();
                renderSeats();
                updateSummary();

                // clear button listener
                clearBtn.addEventListener('click', clearSelection);

                // checkout button listener
                checkoutBtn.addEventListener('click', proceedToCheckout);

                // Initialize checkout button state
                updateSummary();

                // Show a welcome hint
                setTimeout(() => {
                    showMessage('👆 Tap on available seats to select them.', false);
                }, 500);
            }

            // start app
            init();
        })();
    </script>
</body>
</html>
